# Dashboard theme: same colours as the report charts
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
font = "sans-serif"

[server]
headless = true
# Uploaded GPS tracks are small: cap uploads at 20 MB
maxUploadSize = 20

[browser]
gatherUsageStats = false
