method_title = "Comment les scores sont-ils calculés ?"
method = '''
**Danger** (0 = rien à craindre, 100 = n’y allez pas). À chaque point, chaque aléa (orage, verglas, neige, forte
pluie, rafales, chaleur, froid, mauvaise visibilité, obscurité) reçoit un score de 0 à 100, qui monte entre un seuil
où il commence à compter et un seuil où il devient grave. Les seuils dépendent de l’activité : une rafale à
60 km/h vaut 50 à vélo et 0 en voiture. Les aléas rencontrés en même temps s’additionnent comme des risques
indépendants, et le score de l’itinéraire vaut 70 % de son pire moment et 30 % de la moyenne sur le temps de trajet.

**Confort** (100 = idéal pour l’activité). Des points sont retirés à chaque point pour une température hors de la
plage agréable de l’activité, l’air lourd, la pluie, le vent (le vent de face à vélo), la neige, le soleil fort,
l’obscurité et le brouillard, puis moyennés sur le temps de trajet.

**Qualité de l’air** (prévisions jusqu’à environ 4 jours) : le confort perd des points au-delà d’un indice européen
de qualité de l’air de {aqi}, davantage à vélo qu’à pied, peu en voiture ; le danger monte des seuils européens
d’information aux seuils d’alerte (ozone {o3a}-{o3b} µg/m³, PM10 {pma}-{pmb} µg/m³).

**Vigilances officielles** : quand la vigilance Météo-France est connectée, une vigilance orange là et quand vous
passez ajoute un aléa de 50, une rouge 90.

**Conseils** : des règles simples sur les conditions rencontrées, où et quand, formulées pour l’activité. Ils ne
remplacent pas les vigilances officielles. Détails et seuils : `meteo/route_scores.py`.
'''
times_title = "Comment les temps sont-ils calculés ?"
times_method = '''
**Marche** : la règle de Tobler pour la randonnée, ramenée à votre vitesse sur le plat. Une descente douce est la
plus rapide ; les fortes pentes ralentissent à la montée comme à la descente.

**Vélo** : un effort constant. La puissance qui tient votre vitesse sur le plat sans vent est conservée sur chaque
tronçon, et la vitesse est celle où elle équilibre la pesanteur, la résistance au roulement et la traînée de l’air
(cycliste et vélo de 85 kg, position route). Le vent de face ou arrière prévu à chaque point change la traînée :
les temps sont calculés sans vent, la météo lue, puis les temps recalculés avec ce vent et la météo relue. Les
descentes sont plafonnées à 55 km/h, les fortes montées ne descendent pas sous 4 km/h (vélo poussé).

**Voiture** : votre vitesse, quelle que soit la pente. Détails : `meteo/route_timing.py`.
'''
