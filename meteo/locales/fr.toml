  du dernier jour mesuré, sur les jours de la même saison (±45 jours) de ces {years} années. À {city} à cette époque
  de l’année, {kept1} de l’écart sur la température maximale est encore là le lendemain, {kept3} au bout de trois
  jours et {kept7} au bout d’une semaine.
