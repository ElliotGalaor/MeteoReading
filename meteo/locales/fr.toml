- **Séries non homogénéisées** : changements d’instruments, urbanisation autour des stations ou déplacements
  peuvent créer des ruptures. Météo-France publie des séries homogénéisées pour la recherche ; ici, seuls les
  déplacements identifiés sont corrigés (raccordement avec un biais mensuel).
- **Une station par ville** : elle représente la ville, pas tout son territoire (îlot de chaleur urbain, relief).
- **Tendance linéaire** : utile pour résumer, mais le réchauffement s’accélère depuis les années 1980.
- **Autocorrélation** : les tests supposent des années indépendantes, les p-values sont donc un peu optimistes.
- **Année en cours** : {next} est incomplète et exclue des statistiques annuelles.
'''

[ahead]
title = "Climat à venir"
lead = "À quoi ressemblerait le climat de chaque ville dans une France plus chaude de 2 °C, 2,7 °C et 4 °C qu’avant l’ère industrielle : les niveaux de réchauffement que l’État prévoit pour 2030, 2050 et 2100."
warning = "**Des scénarios, pas des prévisions.** Ces chiffres reprennent les jours mesurés récemment, réchauffés de la valeur prévue par la trajectoire officielle (TRACC), répartie entre les saisons comme le font sept modèles climatiques. L’écart entre les modèles est toujours montré, jamais un chiffre unique."
no_table = "Cette vue a besoin des réponses des modèles climatiques : lancez une fois `python -m meteo climate`, puis `python -m meteo analyze`."
level = "+{warming} °C en {year}"
rr = "Cumul annuel de pluie"
measured = "Mesuré"
scenario = "Scénario (médiane des modèles)"
hover_measured = "%{x} : %{y:.1f}<extra>mesuré</extra>"
hover_scenario = "%{x} : %{y:.1f} (modèles : %{customdata[0]:.1f} à %{customdata[1]:.1f})<extra>scénario</extra>"
days_per_year = "jours / an"
range = "(modèles : {low} à {high})"
set_by_level = "(fixé par le niveau de réchauffement)"
sub = "{recent} : {now} · à {level} : {value} {spread}"
step = "+{warming} °C ({year})"
region_North = "Nord"
region_West = "Ouest"
region_East = "Est"
region_South = "Sud"
method_title = "Méthode et limites"
method = '''
**Niveaux de réchauffement.** La *trajectoire de réchauffement de référence pour l’adaptation au changement
climatique* (TRACC), la référence que l’État demande aux aménageurs d’utiliser, fixe la France métropolitaine à
+2 °C en 2030, +2,7 °C en 2050 et +4 °C en 2100 par rapport au climat préindustriel. La France s’était réchauffée
d’environ +{now} °C en 2020 (Météo-France) : le réchauffement encore à venir est donc de {steps}.

**Saisons, jours et nuits.** Le réchauffement n’est pas le même l’été et l’hiver, le jour et la nuit, et la pluie
change avec lui. Cette répartition vient de sept modèles climatiques à haute résolution (CMIP6 HighResMIP : {models}),
via l’API Climate d’Open-Meteo, au point de France le plus proche de {city} ({region} : {lat}° N, {lon}° E). Dans
chaque modèle, l’évolution des températures maximale et minimale moyennes de chaque saison entre 1995-2006 et
2039-2050 est divisée par celle de la température moyenne annuelle, de même pour la pluie de chaque saison.

**Jours.** Chaque jour mesuré à {city} en {recent} est décalé de l’évolution donnée par le modèle multipliée par le
réchauffement encore à venir, puis les indicateurs sont recomptés. Les barres montrent la médiane des sept modèles,
les traits le plus bas et le plus haut.

**Limites.**
- La variabilité d’un jour à l’autre reste celle mesurée : les vagues de chaleur deviennent plus chaudes, pas plus
  longues ni plus fréquentes, si bien que les nombres de jours chauds et de nuits tropicales sont plutôt sous-estimés.
- Les réponses des modèles viennent de quatre points de France, pas de chaque ville ; ce sont celles du scénario
  HighResMIP, ramenées aux niveaux de la TRACC.
- La TRACC est une trajectoire de planification, pas une prévision : le réchauffement atteint dépendra des émissions.
- Pour comparer avec les indicateurs de Météo-France pour chaque commune, voir Climadiag Commune (meteofrance.com).
'''

