how = '''
- **Heatwaves and cold waves** follow Météo-France's method for its national indicators (Ouzeau et al., 2016), on
  each city's daily mean temperature: three thresholds from the {first}-{last} daily means, the {h0}th, {h1}th and
  {h2}th percentiles for heat (the {c0}th, {c1}th and {c2}th for cold). An episode is a run of days beyond the
  second threshold that reaches the first at least once; it carries on through up to {max_break} days that stay
  beyond the third.
- **Intensity**: the sum, over the days of the episode, of the gap between the daily mean and the second threshold.
- **Dry spells**: runs of at least {min_dry} days with less than {rain} mm of rain, ranked by their length divided by
  the city's usual longest spell of a year: Mediterranean summers are always dry.
'''

