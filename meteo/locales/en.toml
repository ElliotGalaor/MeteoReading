how = '''
- **Daytime temperature** = 0.75 × maximum + 0.25 × minimum, about the mean of 10:00 to 18:00. It must lie in the
  activity's comfortable range: **{walk_low}-{walk_high} °C for walking, {bike_low}-{bike_high} °C for cycling**,
  the ranges where the route comfort score (`meteo/route_scores.py`) takes off no points for temperature.
- **Dry**: less than {rain} mm of rain that day.
- **Wind**: mean wind under {wind} km/h, where the walking comfort score starts to take points off. A daily mean has
  no direction, so cycling uses the same limit rather than the headwind. Left out when a period has wind values on
  fewer than 80% of its days{here}.
- Sunshine and humidity are not in every station's files: they are not used.
- **Seasons**: the days whose normal maximum, smoothed over ±15 days, is at least {warm} °C (warm) or at most
  {cold} °C (cold).
'''

