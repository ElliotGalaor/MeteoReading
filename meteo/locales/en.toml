limits_title = "Limitations of the analysis"
limits = '''
- **Non-homogenised series**: changes of instruments, urbanisation around stations or relocations can create
  breaks. Météo-France publishes homogenised series for research; here only the identified relocations are
  corrected (splicing with a monthly bias).
- **One station per city**: it represents the city, not its whole area (urban heat island, terrain).
- **Linear trend**: useful as a summary, but warming has been speeding up since the 1980s.
- **Autocorrelation**: the tests assume independent years, so the p-values are slightly optimistic.
- **Current year**: {next} is incomplete and excluded from annual statistics.
'''

[ahead]
title = "Climate ahead"
lead = "What each city's climate would look like in a France 2 °C, 2.7 °C and 4 °C warmer than before the industrial era: the warming levels the French State plans for in 2030, 2050 and 2100."
warning = "**Scenarios, not forecasts.** These figures show the days measured recently, made warmer by the amount the official trajectory (TRACC) plans for, split between seasons as seven climate models do. The range across the models is shown, never a single number."
no_table = "This view needs the climate model patterns: run `python -m meteo climate` once, then `python -m meteo analyze`."
level = "+{warming} °C, {year}"
rr = "Annual rainfall"
measured = "Measured"
scenario = "Scenario (median of the models)"
hover_measured = "%{x}: %{y:.1f}<extra>measured</extra>"
hover_scenario = "%{x}: %{y:.1f} (models: %{customdata[0]:.1f} to %{customdata[1]:.1f})<extra>scenario</extra>"
days_per_year = "days / year"
range = "(models: {low} to {high})"
set_by_level = "(set by the warming level)"
sub = "{recent}: {now} · at {level}: {value} {spread}"
step = "+{warming} °C ({year})"
region_North = "North"
region_West = "West"
region_East = "East"
region_South = "South"
method_title = "Method and limits"
method = '''
**Warming levels.** The *trajectoire de réchauffement de référence pour l'adaptation au changement climatique*
(TRACC), the reference the French State asks planners to use, sets mainland France at +2 °C in 2030, +2.7 °C in 2050
and +4 °C in 2100 compared with the pre-industrial climate. France had warmed by about +{now} °C by 2020
(Météo-France), so the warming still to come is {steps}.

**Seasons, days and nights.** Warming is not the same in summer and winter, by day and by night, and rainfall
changes with it. These splits come from seven high-resolution climate models (CMIP6 HighResMIP: {models}), through
the Open-Meteo Climate API, at the point of France closest to {city} ({region}: {lat}° N, {lon}° E). In each model,
the change of each season's mean maximum and minimum temperature between 1995-2006 and 2039-2050 is divided by the
change of the annual mean temperature, and so is the change of each season's rainfall.

**Days.** Every day measured in {city} in {recent} is shifted by that model's change times the warming still to
come, and the indicators are counted again. The bars show the median of the seven models, the lines the lowest and
highest.

**Limits.**
- Day-to-day variability stays the one measured: heatwaves get hotter, not longer or more frequent, so the counts of
  hot days and tropical nights are rather low estimates.
- The model patterns come from four points of France, not from each city; they are those of the HighResMIP
  scenario, scaled to the TRACC levels.
- The TRACC is a planning trajectory, not a forecast: the warming actually reached will depend on emissions.
- To compare with Météo-France's own indicators for each commune, see Climadiag Commune (meteofrance.com).
'''

