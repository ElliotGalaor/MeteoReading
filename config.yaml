  - {name: Nantes,           dep: "44", lat: 47.2184, lon: -1.5536, alt: 20}
  - {name: Strasbourg,       dep: "67", lat: 48.5734, lon: 7.7521, alt: 142}
  - {name: Montpellier,      dep: "34", lat: 43.6108, lon: 3.8767, alt: 27}
  - {name: Bordeaux,         dep: "33", lat: 44.8378, lon: -0.5792, alt: 15}
  - {name: Lille,            dep: "59", lat: 50.6292, lon: 3.0573, alt: 25}
  - {name: Rennes,           dep: "35", lat: 48.1173, lon: -1.6778, alt: 40}
  - {name: Brest,            dep: "29", lat: 48.3904, lon: -4.4861, alt: 50}
  - {name: Clermont-Ferrand, dep: "63", lat: 45.7772, lon: 3.0870, alt: 358}
  - {name: Dijon,            dep: "21", lat: 47.3220, lon: 5.0415, alt: 245}
