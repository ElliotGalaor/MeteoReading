# ---------------------------------------------------------------------------
# Météo Analytics pipeline configuration
# Every behaviour of the project is set here: no hard-coded values in the code.
# ---------------------------------------------------------------------------

source:
  # Official Météo-France dataset published on data.gouv.fr
  # "Données climatologiques de base - quotidiennes" (Etalab 2.0 open licence)
  dataset_api: https://www.data.gouv.fr/api/1/datasets/donnees-climatologiques-de-base-quotidiennes/
  # Files to fetch for each département (French administrative area):
  #   previous = 1950 to year N-2, latest = year N-1 to today, avant = before 1949
  periods: [previous, latest]
  # Départements downloaded IN ADDITION to those of the cities below ("all" = the whole of France)
  extra_departments: []
  # Number of parallel downloads
  workers: 6

paths:
  raw: data/raw                    # "bronze" layer: immutable raw files + manifest
  warehouse: data/warehouse.duckdb # analytical database (silver / gold layers)
  reports: reports                 # HTML report, figures, JSON results

analysis:
  start_year: 1951                 # first year analysed
  end_year: 2025                   # last complete year
  reference_period: [1991, 2020]   # current WMO climate normal
  old_period: [1961, 1990]         # previous normal, for comparison
  recent_period: [2011, 2025]      # last 15 years
  station_min_completeness: 0.85   # minimum share of days with both TN and TX over the period
  station_max_distance_km: 40      # search radius around the city centre
  station_max_altitude_diff_m: 200 # maximum altitude gap between station and city centre
  month_min_completeness: 0.90     # a month is valid if >= 90% of its days have data
  year_min_completeness: 0.95      # a year is valid if >= 95% of its days have data

thresholds:                        # thresholds of the extreme-weather indicators (°C or mm)
  hot_day: 30                      # hot day: TX >= 30 °C
  very_hot_day: 35                 # very hot day: TX >= 35 °C
  tropical_night: 20               # tropical night: TN >= 20 °C
  frost_day: 0                     # frost day: TN < 0 °C
  rain_day: 1                      # rainy day: RR >= 1 mm
  heavy_rain: 20                   # heavy rain: RR >= 20 mm
  heatwave_min_days: 3             # heat episode: >= 3 consecutive days with TX >= 30 °C

era5:                              # cross-validation against the ERA5 reanalysis (Open-Meteo API)
  api: https://archive-api.open-meteo.com/v1/archive
  start: "2015-01-01"
  end: "2024-12-31"
  max_weighted_calls_per_minute: 400  # free quota = 600/min, keep a safety margin

# Raw values checked by hand against published sources and found wrong. The quality step marks them
# 'rejected', so they drop out of every analysis and record, while the raw file still holds that value
# (a correction published by Météo-France takes over). variable: tn, tx, tm, rr, ffm or fxi, in the file's
# unit (°C, mm, m/s). The reason is shown on the dashboard's quality page.
# Checked and kept: Clermont-Ferrand, 47 m/s (169 km/h) on 5 Nov 1951. That day the station's mean wind was
#   65 km/h and the Puy de Dôme summit's 107 km/h, in warm, dry southerly wind; France 3 Auvergne reports it as
#   the airport's strongest gust, ahead of 158 km/h on 27 Dec 1999.
rejected_values:
  - station: "06088001"   # Nice
    date: 1955-02-19
    variable: fxi
    value: 50.0
    reason:
      en: "a gust of 180 km/h. The storm of 18-19 February 1955 is reported at 105 km/h in Nice, Cannes measured 68 km/h that day, and Nice's mean wind (30 km/h) was the same as the day before."
      fr: "une rafale de 180 km/h. La tempête du 18-19 février 1955 est donnée à 105 km/h à Nice, Cannes a mesuré 68 km/h ce jour-là, et le vent moyen à Nice (30 km/h) était le même que la veille."
    source: https://www.meteo-paris.com/en/chronique/annee/1955

# 20 large cities covering the main French climates.
# alt: altitude of the city centre (m), used to rule out nearby mountain stations.
# stations (optional): forces the reference station, or a CHAIN of stations in order of
#   priority when a station has moved. Secondary stations are corrected for the bias
#   measured over the period where they overlap the main station.
#   - Reims: Reims-Courcy closed in 2014 -> continued by Reims-Prunay (opened in 2012)
#   - Grenoble: St-Geoirs has gaps before 1970 -> filled with Grenoble-Eybens (1950-1968)
#   - Limoges: Le Palais-sur-Vienne has missing days -> filled with Limoges-Bellegarde, then Feytiat
cities:
  - {name: Paris,            dep: "75", lat: 48.8566, lon: 2.3522, alt: 35}
  - {name: Marseille,        dep: "13", lat: 43.2965, lon: 5.3698, alt: 12}
  - {name: Lyon,             dep: "69", lat: 45.7640, lon: 4.8357, alt: 175}
